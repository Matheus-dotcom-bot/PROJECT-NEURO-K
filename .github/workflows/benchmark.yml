name: Benchmark validation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Start worker
        run: |
          python worker.py --host 127.0.0.1 --port 5555 > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 2
      - name: Run reproducible smoke benchmark
        run: |
          mkdir -p artifacts
          python orchestrator.py --worker tcp://127.0.0.1:5555 --sizes 64 128 256 --results artifacts/benchmark-results.csv
      - name: Validate benchmark output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("artifacts/benchmark-results.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          assert len(rows) == 3, rows
          assert all(row["status"] == "MEASURED" for row in rows), rows
          assert all(row["error"] in ("", None) for row in rows), rows
          assert [int(row["n"]) for row in rows] == [64, 128, 256]
          print(f"Validated {len(rows)} measured benchmark rows")
          PY
      - name: Stop worker
        if: always()
        run: |
          if [ -f worker.pid ]; then kill "$(cat worker.pid)" || true; fi
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: neuro-k-benchmark
          path: |
            artifacts/benchmark-results.csv
            worker.log
